<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>積木機車 → Low-poly</title>
<style>
  html,body{margin:0;height:100%;background:#1b2030;color:#dfe6f5;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:6px}
  #ui .row{display:flex;gap:6px}
  button{background:#2c3550;color:#dfe6f5;border:1px solid #46527a;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  button.on{background:#e8833a;border-color:#e8833a;color:#fff}
  #info{position:fixed;bottom:10px;left:10px;opacity:.75;font-size:12px}
</style>
</head>
<body>
<div id="ui">
  <div class="row">
    <button data-mode="blocks">積木</button>
    <button data-mode="lowpoly" class="on">Low-poly（凸包）</button>
    <button data-mode="both">疊合</button>
  </div>
  <div class="row"><button id="spin" class="on">自動旋轉</button></div>
  <label class="row" style="align-items:center">顆粒大小 <select id="res"><option value="1">1（粗）</option><option value="0.5">1/2</option><option value="0.3333333" selected>1/3</option><option value="0.25">1/4（極細）</option></select></label>
  <label class="row" style="align-items:center">凸包精細度 <input id="k" type="range" min="1" max="8" value="5"> <span id="kv"></span></label>
</div>
<div id="info"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="hull.js"></script>
<script>
// ───────── 1. 機車的「形狀描述」，再用正立方體小積木去填滿 ─────────
// 單位長度 = 1；x 朝前、y 朝上、z 左右（左右對稱）。後蓋的 shapes 之後的會蓋掉前面的。
const shapes = [];
const shape = (part, color, inside) => shapes.push({ part, color, inside });
// 軸對齊長方體。參數用「格子編號(含頭尾)」，也就是範圍會各外擴 0.5
const box = (part, color, x0, x1, y0, y1, z0, z1) =>
  shape(part, color, (x, y, z) => x >= x0 - .5 && x <= x1 + .5 && y >= y0 - .5 && y <= y1 + .5 && z >= z0 - .5 && z <= z1 + .5);
const sym = (fn) => { fn(1); fn(-1); };
// 輪子：圓環(輪胎) + 內圓(輪圈) + 中心(輪轂)，圓面在 x-y 平面
function wheel(name, cx, cy, z0, z1) {
  const zin = (z) => z >= z0 - .5 && z <= z1 + .5;
  shape(name + 'Tire', 0x2b2d33, (x, y, z) => { const d = Math.hypot(x - cx, y - cy); return zin(z) && d <= 4.4 && d > 3.0; });
  shape(name + 'Rim', 0xc9d1e0, (x, y, z) => { const d = Math.hypot(x - cx, y - cy); return zin(z) && d <= 3.0 && d > 1.2; });
  shape(name + 'Hub', 0x8a93a8, (x, y, z) => zin(z) && Math.hypot(x - cx, y - cy) <= 1.2);
}
wheel('rear', 6, 4, -1, 1);
wheel('front', 22, 4, 0, 0);
box('frontHub', 0x8a93a8, 22, 22, 4, 4, -1, 1);
// 引擎
box('engine', 0x6d7685, 11, 16, 2, 5, -1, 1);
box('engine', 0x6d7685, 12, 15, 6, 7, -1, 1);
// 車架
box('frame', 0x3a3f4d, 9, 12, 6, 8, 0, 0);
box('frame', 0x3a3f4d, 16, 19, 6, 8, 0, 0);
// 油箱、座墊、尾翼
box('tank', 0xd9342b, 14, 20, 9, 10, -1, 1);
box('tank', 0xd9342b, 13, 13, 9, 9, -1, 1);
box('seat', 0x2a2a2e, 7, 12, 9, 9, -1, 1);
box('tail', 0xd9342b, 3, 6, 9, 10, -1, 1);
box('taillight', 0xff5a4a, 2, 2, 10, 10, 0, 0);
// 前叉：從車軸斜向後上方的一條粗 1 的斜線
sym((sg) => shape('fork', 0xaab3c5, (x, y, z) => {
  if (Math.abs(z - sg) > .5 || y < 3.5 || y > 12.5) return false;
  const cx = 22 - (y - 4) * 0.3;
  return Math.abs(x - cx) <= .5;
}));
box('fender', 0xd9342b, 20, 25, 9, 9, 0, 0);
// 龍頭、後視鏡、頭燈
box('bar', 0x2a2a2e, 19, 20, 13, 13, -3, 3);
sym((sg) => box('mirror', 0xaab3c5, 19, 19, 14, 15, 3 * sg, 3 * sg));
box('light', 0xf3e6a1, 21, 22, 10, 12, -1, 1);
// 後叉與排氣管
sym((sg) => {
  box('swing', 0x3a3f4d, 6, 9, 3, 3, 2 * sg, 2 * sg);
  box('exhaust', 0xb8bcc6, 11, 15, 2, 2, 2 * sg, 2 * sg);
  box('exhaust', 0xb8bcc6, 10, 11, 3, 3, 2 * sg, 2 * sg);
  box('exhaust', 0xb8bcc6, 4, 10, 4, 4, 2 * sg, 2 * sg);
});

// 把形狀用邊長 s 的正立方體格子取樣：格子中心在形狀內就放一顆積木
let S = 1, cells = [], V = new Map();
function voxelize(s) {
  S = s; V = new Map(); cells = [];
  const n = (v) => Math.round(v / s);
  for (let i = n(0); i <= n(27); i++) for (let j = n(-0.5); j <= n(16); j++) for (let k = n(-4); k <= n(4); k++) {
    const x = i * s, y = j * s, z = k * s;
    let hit = null;
    for (const sh of shapes) if (sh.inside(x, y, z)) hit = sh; // 後定義的蓋掉先前的
    if (hit) V.set(i + ',' + j + ',' + k, { idx: [i, j, k], p: [x, y, z], part: hit.part, color: hit.color });
  }
  cells = [...V.values()];
}

// ───────── 2. 每個零件各自做「近似凸分解」+ 凸包 ─────────
// 對一個零件的積木集合：
//   1. 算凸包，比較「凸包體積」與「積木實際體積」→ 凹度 = (凸包 − 實際) / 凸包
//   2. 凹度 ≤ 容許值 → 這塊夠凸，直接輸出這個凸包
//   3. 否則沿 x/y/z 某一軸切成兩半（試多個切點，選兩半凸包體積總和最小的），遞迴處理
// 輪胎這種環形會被切成一段段圓弧，引擎、油箱這種本來就凸的零件則保持一整塊。
const hullOf = (list) => {
  const inSet = new Set(list.map((c) => c.idx.join(',')));
  const pts = [];
  for (const c of list) {
    const [i, j, l] = c.idx;
    if (inSet.has((i + 1) + ',' + j + ',' + l) && inSet.has((i - 1) + ',' + j + ',' + l) && inSet.has(i + ',' + (j + 1) + ',' + l) &&
        inSet.has(i + ',' + (j - 1) + ',' + l) && inSet.has(i + ',' + j + ',' + (l + 1)) && inSet.has(i + ',' + j + ',' + (l - 1))) continue; // 內部
    const h = S / 2, [x, y, z] = c.p;
    for (const dx of [-h, h]) for (const dy of [-h, h]) for (const dz of [-h, h]) pts.push([x + dx, y + dy, z + dz]);
  }
  const hull = Hull.convexHull(pts);
  return { hull, vol: Hull.volume(hull) };
};
const cellVol = () => S * S * S;

function decompose(list, tol, out) {
  const h = hullOf(list);
  const concavity = (h.vol - list.length * cellVol()) / h.vol;
  if (concavity <= tol || list.length <= 2) return out.push({ list, hull: h.hull });
  let best = null;
  for (let axis = 0; axis < 3; axis++) {
    const vals = [...new Set(list.map((c) => c.idx[axis]))].sort((p, q) => p - q);
    if (vals.length < 2) continue;
    const cuts = new Set([1 / 4, 1 / 3, 1 / 2, 2 / 3, 3 / 4].map((f) => vals[Math.max(1, Math.round(vals.length * f))] ?? vals[vals.length - 1]));
    for (const c of cuts) {
      if (c === vals[0]) continue;
      const A = list.filter((v) => v.idx[axis] < c), Bq = list.filter((v) => v.idx[axis] >= c);
      if (!A.length || !Bq.length) continue;
      const cost = hullOf(A).vol + hullOf(Bq).vol;
      if (!best || cost < best.cost) best = { cost, A, B: Bq };
    }
  }
  if (!best || best.cost >= h.vol * 0.999) return out.push({ list, hull: h.hull }); // 切了也沒有更好
  decompose(best.A, tol, out); decompose(best.B, tol, out);
}

function buildHulls(tol) {
  const parts = new Map();
  for (const c of cells) (parts.get(c.part) || parts.set(c.part, []).get(c.part)).push(c);
  const out = [];
  for (const [part, list] of parts) {
    const pieces = [];
    decompose(list, tol, pieces);
    // 輪圈/輪轂的側面與輪胎共面，稍微往外推一點避免 z-fighting
    const zs = /Hub$/.test(part) ? 1.02 : /Rim$/.test(part) ? 1.01 : 1;
    for (const p of pieces) {
      p.hull.vertices = p.hull.vertices.map(([x, y, z]) => [x, y, z * zs]);
      out.push({ color: list[0].color, hull: p.hull, part });
    }
  }
  return out;
}

// ───────── 3. three.js 場景 ─────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2030);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x303848, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(20, 40, 30); scene.add(sun);
const grid = new THREE.GridHelper(48, 48, 0x46527a, 0x2c3550); grid.position.set(13, -0.5, 0); scene.add(grid);
const world = new THREE.Group(); world.position.set(-13, 0, 0); scene.add(world); // 讓機車置中
const blockRoot = new THREE.Group(), polyRoot = new THREE.Group();
world.add(blockRoot, polyRoot);

function rebuildBlocks() {
  blockRoot.children.slice().forEach((o) => { blockRoot.remove(o); o.geometry.dispose(); o.dispose && o.dispose(); });
  const cube = new THREE.InstancedMesh(new THREE.BoxGeometry(S * 0.96, S * 0.96, S * 0.96), new THREE.MeshStandardMaterial({ roughness: 0.6 }), cells.length);
  const m = new THREE.Matrix4(), col = new THREE.Color();
  cells.forEach((c, i) => {
    m.makeTranslation(...c.p); cube.setMatrixAt(i, m);
    cube.setColorAt(i, col.set(c.color).offsetHSL(0, 0, (Math.random() - 0.5) * 0.06));
  });
  blockRoot.add(cube);
}

function rebuildPoly(k) {
  const tol = 0.5 * Math.pow(0.7, k - 1); // 精細度 1→容許凹度 50%，8→約 4%
  polyRoot.children.slice().forEach((o) => { polyRoot.remove(o); o.geometry.dispose(); });
  const t0 = performance.now();
  const hulls = buildHulls(tol);
  const ms = Math.round(performance.now() - t0);
  const pos = [], colr = [], lines = [];
  let nV = 0, nP = 0;
  for (const { color, hull } of hulls) {
    const base = new THREE.Color(color);
    nV += hull.vertices.length; nP += hull.polygons.length;
    for (const poly of hull.polygons) {
      const c = base.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.12);
      for (let i = 1; i < poly.length - 1; i++)
        for (const j of [poly[0], poly[i], poly[i + 1]]) { pos.push(...hull.vertices[j]); colr.push(c.r, c.g, c.b); }
      for (let i = 0; i < poly.length; i++) lines.push(...hull.vertices[poly[i]], ...hull.vertices[poly[(i + 1) % poly.length]]);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colr, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lines, 3));
  polyRoot.add(new THREE.Mesh(geo, mat), new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 })));
  document.getElementById('info').textContent =
    `${cells.length} 顆正立方體積木（邊長 ${+S.toFixed(3)}）→ ${hulls.length} 個凸包（每個零件各自分解），${nV} 頂點 / ${nP} 面 / ${pos.length / 9} 三角形　｜　拖曳旋轉、滾輪縮放`;
  document.getElementById('kv').textContent = `容許凹度 ${(tol * 100).toFixed(1)}%（${ms} ms）`;
  applyMode();
}

// ───────── 4. 模式切換與簡易軌道控制 ─────────
let mode = 'lowpoly', spin = true;
function applyMode() {
  blockRoot.visible = mode !== 'lowpoly';
  polyRoot.visible = mode !== 'blocks';
  const mesh = polyRoot.children[0];
  if (mesh) { mesh.material.transparent = mode === 'both'; mesh.material.opacity = mode === 'both' ? 0.5 : 1; mesh.material.depthWrite = mode !== 'both'; mesh.material.needsUpdate = true; }
  document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
}
document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => { mode = b.dataset.mode; applyMode(); }));
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.classList.toggle('on', spin); };
const ks = document.getElementById('k'), rs = document.getElementById('res');
ks.oninput = () => rebuildPoly(+ks.value);
function rebuildAll() { voxelize(+rs.value); rebuildBlocks(); rebuildPoly(+ks.value); }
rs.onchange = rebuildAll;
rebuildAll();

let yaw = -0.6, pitch = 0.25, dist = 44, drag = null;
const el = renderer.domElement;
el.onpointerdown = (e) => { drag = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); };
el.onpointerup = () => (drag = null);
el.onpointermove = (e) => {
  if (!drag) return;
  yaw -= (e.clientX - drag[0]) * 0.008;
  pitch = Math.max(-0.2, Math.min(1.4, pitch + (e.clientY - drag[1]) * 0.008));
  drag = [e.clientX, e.clientY];
};
el.onwheel = (e) => { e.preventDefault(); dist = Math.max(15, Math.min(90, dist * (1 + e.deltaY * 0.001))); };
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
(function loop() {
  if (spin && !drag) yaw += 0.006;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, 6 + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, 6, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
